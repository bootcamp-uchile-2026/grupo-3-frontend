<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Historial Médico</title>
</head>

<body>
    <main>
        <section>
            <div class="container">
                <h1>Historial Médico</h1>
                <div class="tabs-container">
                    <div class="tab-buttons">
                        <button class="tab-btn active">Consultas</button>
                        <button class="tab-btn">Vacunas</button>
                        <button class="tab-btn">Examenes</button>
                    </div>
                    <div id="tab1" class="tab-content active">
                        <div class="filtro">
                            <form id="filtro-form" method="get">
                                <label for="filtro-clinica">Clinica</label>
                                <select name="filtro-clinica" id="filtro-clincia">
                                    <option value="clinica-1">Clinica 1</option>
                                    <option value="clinica-2">Clinica 2</option>
                                    <option value="clinica-3">Clinica 3</option>
                                </select>
                                <label for="filtro-veterinario">Veterinario</label>
                                <select name="filtro-veterinario" id="filtro-veterinario">
                                    <option value="vet-1">Veterinario 1</option>
                                    <option value="vet-2">Veterinario 2</option>
                                    <option value="vet-3">Veterinario 3</option>
                                </select>
                                <label for="filtro-fecha-desde">Desde</label>
                                <input type="date" id="filtro-fecha-desde" name="filtro-fecha-desde">
                                <label for="filtro-fecha-hasta">Hasta</label>
                                <input type="date" id="filtro-fecha-hasta" name="filtro-fecha-hasta">
                                <button>Buscar</button>
                            </form>
                        </div>
                    </div>
                    <div id="tab2" class="tab-content">
                        <h3>Contenido 2</h3>
                        <p>Este es el texto de la segunda pestaña.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>

</html>
