<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Mascotas</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
    <h1>Registro de Mascotas</h1>
</header>

<main>
    <section>
        <h2>Formulario de Registro</h2>

        <form id="formRegistroMascota">
            <div>
        <label for="nombre">Nombre de la mascota</label><br>
        <input
            type="text"
            id="nombre"
            name="nombre"
            placeholder="Ingrese el nombre de la mascota"
            required>
    </div>

    <br>

    <div>
        <label for="raza">Raza</label><br>
        <input
            type="text"
            id="raza"
            name="raza"
            placeholder="Ingrese la raza"
            required>
    </div>
    <br>

<div>
    <label>Sexo</label><br>

    <input
        type="radio"
        id="macho"
        name="sexo"
        value="macho"
        required>

    <label for="macho">Macho</label>

    <input
        type="radio"
        id="hembra"
        name="sexo"
        value="hembra">

    <label for="hembra">Hembra</label>
</div>
<br>
<div>
    <label for="edad">Edad (años)</label><br>
    <input
        type="number"
        id="edad"
        name="edad"
        placeholder="Ingrese la edad"
        min="0"
        required>
</div>

<br>

<div>
    <label for="peso">Peso (kg)</label><br>
    <input
        type="number"
        id="peso"
        name="peso"
        placeholder="Ingrese el peso"
        step="0.1"
        min="0"
        required>
</div>
<br>

<div>
    <label for="dueno">Dueño</label><br>
    <input
        type="text"
        id="dueno"
        name="dueno"
        placeholder="Ingrese el nombre del dueño"
        required>

</div>

<br>

<div>
    <label for="condicionesSalud">Condiciones de salud</label><br>

    <textarea
        id="condicionesSalud"
        name="condicionesSalud"
        rows="5"
        placeholder="Ingrese antecedentes médicos o condiciones de salud"
        required>
    </textarea>
</div>
    <br>

<div>
    <button type="submit">Registrar mascota</button>
</div>

        </form>
    </section>
</main>
    <script src="js/script.js"></script>
</body>
</html>
